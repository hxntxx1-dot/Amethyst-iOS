name: Build (fork, GitHub-hosted macOS)

# Builds a sideloadable .ipa on GitHub's free macOS runners.
# Run it from the "Actions" tab -> "Build (fork, GitHub-hosted macOS)" -> "Run workflow".
on:
  workflow_dispatch:
  push:
    branches:
      - roblox-style-controls

jobs:
  build:
    if: github.repository != 'AngelAuraMC/Amethyst-iOS'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Select newest Xcode (iOS 26 SDK is required)
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: |
          brew install ldid make cmake || true
          ldid 2>&1 | head -1 || true

      - name: Build ipa
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make -j"$(sysctl -n hw.ncpu)" package PLATFORM=2 BOOTJDK="$JAVA_HOME/bin"

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-roblox-controls-ipa
          path: artifacts/org.angelauramc.amethyst-*-ios.ipa
          if-no-files-found: error

      - name: Upload layout preset
        uses: actions/upload-artifact@v4
        with:
          name: roblox-controlmap
          path: controlmap-presets/*.json
